<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>เกมทายชื่อนักฟุตบอล</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: #111; color: #fff; }
    .card { background: #222; padding: 20px; border-radius: 10px; max-width: 500px; margin: auto; }
    .hint-box { background: #333; padding: 15px; margin: 10px 0; border-radius: 8px; text-align: left; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 5px; border: none; font-size: 16px; }
    button { background: #e0e0e0; color: #000; font-weight: bold; cursor: pointer; }
    .btn-submit { background: #28a745; color: white; }
    .btn-hint { background: #ffc107; }
    .hidden { display: none; }
    #score-board { font-size: 20px; margin-bottom: 15px; }
  </style>
</head>
<body>

<div class="card">
  <h2>⚽ เกมทายชื่อนักเตะ (3 คำใบ้)</h2>
  <div id="score-board">คะแนน: <span id="score">0</span> | ข้อที่: <span id="round">1</span>/8</div>
  <div id="points-info">คำใบ้นี้มีค่า: 3 คะแนน</div>
  
  <div id="hints-area"></div>

  <input type="text" id="answer" placeholder="พิมพ์ชื่อนักเตะ (ภาษาอังกฤษ)..." autocomplete="off">
  <button class="btn-submit" onclick="checkAnswer()">ส่งคำตอบ</button>
  <button class="btn-hint" id="hint-btn" onclick="giveHint()">ขอคำใบ้ถัดไป (-1 คะแนน)</button>
  <button onclick="skipQuestion()">ยอมแพ้ / เฉลย</button>
  <button id="next-btn" class="hidden" onclick="nextQuestion()">ข้อถัดไป</button>
</div>

<script>
  const players = [
    {
      name: "Erling Haaland",
      aliases: ["haaland", "erling haaland"],
      hints: [
        "1. เป็นกองหน้าเจ้าของส่วนสูง 195 ซม. เล่นในลีกยุโรป",
        "2. ทำลายสถิติยิงประตูสูงสุดในฤดูกาลเดียวของพรีเมียร์ลีก",
        "3. เล่นให้ แมนเชสเตอร์ ซิตี้ สวมเบอร์ 9"
      ]
    },
    {
      name: "Mohamed Salah",
      aliases: ["salah", "mohamed salah"],
      hints: [
        "1. เป็นแนวรุกริมเส้นฝั่งขวา ชาวอียิปต์",
        "2. ได้ฉายาว่า King Egyptian และได้รองเท้าทองคำหลายสมัย",
        "3. เล่นให้ ลิเวอร์พูล สวมเบอร์ 11"
      ]
    },
    {
      name: "Kevin De Bruyne",
      aliases: ["de bruyne", "kevin de bruyne"],
      hints: [
        "1. เป็นกองกลางตัวรุก ทีมชาติเบลเยียม",
        "2. ขึ้นชื่อเรื่องการจ่ายบอลและทำแอสซิสต์สูงสุดในลีก",
        "3. เล่นให้ แมนเชสเตอร์ ซิตี้ สวมเบอร์ 17"
      ]
    },
    {
      name: "Kylian Mbappe",
      aliases: ["mbappe", "kylian mbappe"],
      hints: [
        "1. กองหน้าความเร็วสูงชาวฝรั่งเศส",
        "2. เคยยิงแฮตทริกในนัดชิงฟุตบอลโลก",
        "3. ปัจจุบันเล่นให้ เรอัล มาดริด"
      ]
    },
    {
      name: "Jude Bellingham",
      aliases: ["bellingham", "jude bellingham"],
      hints: [
        "1. กองกลางชาวอังกฤษที่ย้ายไปโด่งดังในเยอรมนีตั้งแต่อายุน้อย",
        "2. ได้รางวัล Golden Boy ก่อนย้ายมาสเปน",
        "3. เล่นให้ เรอัล มาดริด มีท่ากางแขนดีใจ"
      ]
    },
    {
      name: "Bukayo Saka",
      aliases: ["saka", "bukayo saka"],
      hints: [
        "1. ปีกขวาชาวอังกฤษ ผลิตผลจากอะคาเดมี่ของสโมสร",
        "2. เป็นกำลังหลักพาทีมลุ้นแชมป์พรีเมียร์ลีก",
        "3. เล่นให้ อาร์เซนอล สวมเบอร์ 7"
      ]
    },
    {
      name: "Harry Kane",
      aliases: ["kane", "harry kane"],
      hints: [
        "1. กองหน้ากัปตันทีมชาติอังกฤษ",
        "2. เป็นดาวซัลโวสูงสุดตลอดกาลของท็อตแนม ฮ็อตสเปอร์",
        "3. ย้ายมาเล่นให้ บาเยิร์น มิวนิค"
      ]
    },
    {
      name: "Bruno Fernandes",
      aliases: ["bruno", "fernandes"],
      hints: [
        "1. กองกลางตัวรุกชาวโปรตุเกส",
        "2. โดดเด่นเรื่องการยิงจุดโทษและการสร้างโอกาส",
        "3. เป็นกัปตันทีม แมนเชสเตอร์ ยูไนเต็ด"
      ]
    }
  ];

  let currentIdx = 0;
  let hintLevel = 0;
  let score = 0;
  let answered = false;

  function loadQuestion() {
    answered = false;
    hintLevel = 0;
    document.getElementById("answer").value = "";
    document.getElementById("answer").disabled = false;
    document.getElementById("next-btn").classList.add("hidden");
    document.getElementById("round").innerText = currentIdx + 1;
    updatePointsInfo();
    showHints();
  }

  function updatePointsInfo() {
    const points = [3, 2, 1][hintLevel];
    document.getElementById("points-info").innerText = `คำใบ้นี้มีค่า: ${points} คะแนน`;
  }

  function showHints() {
    const player = players[currentIdx];
    let html = "";
    for(let i = 0; i <= hintLevel; i++) {
      html += `<div class="hint-box">${player.hints[i]}</div>`;
    }
    document.getElementById("hints-area").innerHTML = html;
  }

  function giveHint() {
    if (answered || hintLevel >= 2) return;
    hintLevel++;
    updatePointsInfo();
    showHints();
    if (hintLevel === 2) {
      document.getElementById("hint-btn").disabled = true;
    }
  }

  function checkAnswer() {
    if (answered) return;
    const userAns = document.getElementById("answer").value.trim().toLowerCase();
    const player = players[currentIdx];
    
    if (player.aliases.includes(userAns)) {
      const points = [3, 2, 1][hintLevel];
      score += points;
      document.getElementById("score").innerText = score;
      alert(`ถูกต้อง! ได้รับ ${points} คะแนน`);
      finishQuestion();
    } else {
      alert("ไม่ถูกครับ ลองใหม่หรือขอคำใบ้เพิ่มนะครับ");
    }
  }

  function skipQuestion() {
    if (answered) return;
    alert(`เฉลยคือ: ${players[currentIdx].name}`);
    finishQuestion();
  }

  function finishQuestion() {
    answered = true;
    document.getElementById("answer").disabled = true;
    document.getElementById("next-btn").classList.remove("hidden");
  }

  function nextQuestion() {
    currentIdx++;
    if (currentIdx < players.length) {
      document.getElementById("hint-btn").disabled = false;
      loadQuestion();
    } else {
      alert(`เกมจบแล้ว! คะแนนรวมของคุณคือ: ${score}`);
      currentIdx = 0;
      score = 0;
      document.getElementById("score").innerText = score;
      document.getElementById("hint-btn").disabled = false;
      loadQuestion();
    }
  }

  loadQuestion();
</script>
</body>
</html>
